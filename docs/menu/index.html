<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title id="pageTitle">المنيو</title>
<meta name="theme-color" content="#fff8ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="../assets/supabase-config.js"></script>
<style>
  :root {
    /* هاي قيم افتراضية — بتنكتب فوقها فورًا بألوان براند المطعم الفعلية (brand_colors) وقت التحميل.
       القالب (structure) مستقل عن الهوية البصرية (identity) — نفس مبدأ الملف الأصلي، محفوظ بالكامل. */
    --brand-primary: #ff431a;
    --brand-secondary: #1c1006;
    --brand-accent: #ffc229;
    --paper: #fff8ec; --paper-warm: #ffefd8; --ink: #1c1006; --ink-soft: #6b5843;
    --green: #1f8a4c; --gray: #9a8a76; --line: #e7d3b4;
    --font-display: 'Lalezar', sans-serif; --font-body: 'Tajawal', sans-serif;
    --hard: 5px 5px 0 var(--ink); --hard-sm: 3px 3px 0 var(--ink); --hard-lg: 7px 7px 0 var(--ink);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* مشتقة من ألوان البراند وقت التشغيل — بلا أي قيمة ثابتة خاصة بمطعم معيّن */
    --brand-primary-press: color-mix(in srgb, var(--brand-primary) 80%, black);
    --brand-primary-tint: color-mix(in srgb, var(--brand-primary) 16%, white);
    --brand-accent-press: color-mix(in srgb, var(--brand-accent) 78%, black);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: var(--font-body); background: var(--paper); color: var(--ink);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4 { font-family: var(--font-display); font-weight:400; letter-spacing:0.01em; }
  button, input { font-family: var(--font-body); }
  button { touch-action:manipulation; }
  .hidden { display:none !important; }
  img { max-width:100%; display:block; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  :focus-visible { outline:3px solid var(--brand-accent); outline-offset:2px; }

  /* ===== شاشات التحميل / الخطأ ===== */
  #loadingScreen, #errorScreen {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2rem 1.5rem; text-align:center; gap:1.1rem;
  }
  .spinner {
    width:42px; height:42px; border-radius:50%; border:5px solid var(--line);
    border-top-color: var(--brand-primary); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingScreen p { font-weight:700; color:var(--ink-soft); }
  .error-icon {
    width:64px; height:64px; border-radius:18px; background:#ffe0d6; border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:1.9rem; font-family:var(--font-display);
    box-shadow: var(--hard-sm);
  }
  #errorScreen h2 { font-size:1.45rem; margin-top:0.15rem; }
  #errorScreen p { color:var(--ink-soft); font-weight:500; max-width:320px; line-height:1.6; }

  /* ===== الهيدر ===== */
  header.topbar {
    position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:3px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1.1rem; gap:0.6rem;
  }
  .brand { display:flex; align-items:center; gap:0.65rem; min-width:0; }
  .brand img.logo { width:42px; height:42px; border-radius:11px; border:2.5px solid var(--ink); object-fit:cover; flex-shrink:0; }
  .brand .logo-fallback {
    width:42px; height:42px; border-radius:11px; background:var(--brand-primary); border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; color:white; font-family:var(--font-display); font-size:1.25rem; flex-shrink:0;
  }
  .brand .brand-text { min-width:0; display:flex; flex-direction:column; gap:0.1rem; }
  .brand .name { font-family:var(--font-display); font-size:1.2rem; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .table-badge {
    display:inline-flex; align-items:center; gap:0.25rem; align-self:flex-start;
    background:var(--brand-primary-tint); border:1.5px solid var(--brand-primary); color:var(--brand-primary-press);
    border-radius:100px; padding:0.08rem 0.5rem; font-size:0.68rem; font-weight:800; white-space:nowrap;
  }
  .header-actions { display:flex; align-items:center; gap:0.5rem; flex-shrink:0; }
  .icon-btn {
    width:36px; height:36px; border-radius:10px; border:2px solid var(--ink); background:white;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.75rem; cursor:pointer;
  }
  .icon-btn:active { transform:translate(1px,1px); }
  .demo-badge {
    background:var(--brand-accent); border:2px solid var(--ink); border-radius:100px; padding:0.25rem 0.7rem;
    font-size:0.72rem; font-weight:800; white-space:nowrap;
  }

  /* ===== تبويبات الفئات — شريط اختيار كبير بلمسة كشك طلب ===== */
  .category-tabs {
    display:flex; gap:0.55rem; overflow-x:auto; padding:0.9rem 1.1rem; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; border-bottom:1px solid var(--line); scroll-snap-type:x proximity;
  }
  .category-tabs::-webkit-scrollbar { display:none; }
  .cat-tab {
    flex-shrink:0; padding:0.62rem 1.15rem; border-radius:100px; border:2.5px solid var(--ink); background:white;
    font-weight:800; font-size:0.9rem; cursor:pointer; white-space:nowrap; scroll-snap-align:start;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .cat-tab.active { background:var(--brand-primary); color:white; box-shadow:var(--hard-sm); transform:translate(-1px,-1px); }
  .cat-tab:active { transform:translate(1px,1px); }

  /* ===== شريط البحث (اختياري حسب settings.show_search) ===== */
  .search-bar { padding: 0 1.1rem 0.9rem; position:relative; }
  .search-bar input {
    width:100%; padding:0.75rem 1rem 0.75rem 2.5rem; border:2.5px solid var(--ink); border-radius:12px; font-size:0.92rem;
    background:white; font-weight:600;
  }
  .search-bar::after {
    content:"🔍"; position:absolute; inset-inline-start:1.9rem; top:50%; transform:translateY(-50%);
    font-size:0.95rem; opacity:0.6; pointer-events:none;
  }

  /* ===== المنتجات — شبكة صناديق كبيرة بأسلوب لوحة طلب سريع ===== */
  .products-container { padding:0.5rem 1.1rem 7rem; }
  .category-section { margin-top:1.3rem; }
  .category-title { font-size:1.3rem; margin-bottom:0.7rem; }
  .products-grid.layout-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:0.9rem; }
  .products-grid.layout-list { display:flex; flex-direction:column; gap:0.7rem; }

  .product-card {
    background:white; border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; box-shadow: var(--hard-sm);
    display:flex; flex-direction:column;
  }
  .product-card.compact { box-shadow:none; border-width:2px; }
  .product-card:active { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink); }
  .product-card.compact:active { transform:none; box-shadow:none; }

  .product-media {
    position:relative; aspect-ratio:1/1; background:var(--paper-warm);
    display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:2.5px solid var(--ink);
  }
  .product-media img { width:100%; height:100%; object-fit:cover; }
  .product-media .no-img { font-size:2.1rem; opacity:0.35; }
  .product-action-float { position:absolute; bottom:8px; inset-inline-end:8px; z-index:2; }

  .product-info { padding:0.85rem 0.85rem 0.9rem; display:flex; flex-direction:column; gap:0.35rem; flex:1; min-width:0; }
  .product-name { font-size:0.96rem; font-weight:800; line-height:1.3; }
  .product-price { font-weight:800; color:var(--brand-primary); font-size:1.02rem; }
  .product-action-inline { margin-top:auto; padding-top:0.3rem; display:flex; justify-content:flex-end; }

  .btn-add-fab {
    width:38px; height:38px; border-radius:50%; background:var(--ink); color:white; border:2.5px solid var(--ink);
    font-size:1.3rem; font-weight:900; cursor:pointer; box-shadow:var(--hard-sm);
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .btn-add-fab:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .qty-stepper {
    display:flex; align-items:center; gap:0.45rem; background:white; border:2.5px solid var(--ink);
    border-radius:100px; padding:0.22rem 0.4rem; box-shadow:var(--hard-sm);
  }
  .qty-stepper button {
    width:26px; height:26px; border-radius:50%; border:none; background:var(--brand-primary); color:white;
    font-weight:900; font-size:0.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .qty-stepper button[data-decr] { background:var(--ink); }
  .qty-stepper button:active { transform:scale(0.9); }
  .qty-stepper span { min-width:16px; text-align:center; font-weight:800; font-size:0.9rem; }

  /* ===== أسلوب القائمة (layout=list) ===== */
  .layout-list .product-card, .product-card.no-image { flex-direction:row; align-items:stretch; }
  .layout-list .product-media, .product-card.no-image .product-media { width:96px; aspect-ratio:1/1; flex-shrink:0; border-bottom:none; border-inline-end:2.5px solid var(--ink); }
  .layout-list .product-action-float { display:none; }
  .layout-list .product-info, .product-card.no-image .product-info { flex-direction:row; align-items:center; flex-wrap:wrap; gap:0.5rem 0.9rem; }
  .layout-list .product-name, .product-card.no-image .product-name { flex:1 1 140px; }
  .layout-list .product-action-inline, .product-card.no-image .product-action-inline { margin-top:0; padding-top:0; }
  .product-card.no-image .product-action-float { display:none; }

  .empty-state { text-align:center; color:var(--ink-soft); padding:3.5rem 1rem; font-weight:600; }

  /* ===== شريط السلة العائم — العنصر الأكثر بروزًا بالشاشة ===== */
  .cart-bar {
    position:fixed; bottom:0; left:0; right:0; padding:0.85rem 1.1rem calc(0.85rem + var(--safe-bottom));
    background:linear-gradient(to top, var(--paper) 55%, transparent); z-index:30; pointer-events:none;
  }
  .cart-bar button {
    pointer-events:auto; width:100%; background:var(--brand-primary); color:white; border:2.5px solid var(--ink); border-radius:16px;
    padding:1rem 1.2rem; font-weight:800; font-size:1rem; box-shadow: var(--hard); cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
  }
  .cart-bar button:active { transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink); }
  .cart-bar .cart-count {
    background:white; color:var(--ink); border-radius:50%; width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.85rem;
  }
  .cart-bar .cart-left { display:flex; align-items:center; gap:0.55rem; }
  .cart-bar .cart-arrow { font-size:1.1rem; }
  @keyframes cartPop { 0% { transform:scale(1); } 35% { transform:scale(1.06); } 100% { transform:scale(1); } }
  .cart-bar.pop button { animation: cartPop 0.32s ease; }

  /* ===== مودال (سلة / تأكيد) ===== */
  .modal { position:fixed; inset:0; z-index:50; background:rgba(28,16,6,0.5); display:flex; align-items:flex-end; }
  .modal-sheet {
    background:var(--paper); width:100%; max-height:88vh; border-radius:22px 22px 0 0; border:2.5px solid var(--ink); border-bottom:none;
    display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:560px) {
    .modal { align-items:center; justify-content:center; }
    .modal-sheet { max-width:440px; border-radius:22px; border-bottom:2.5px solid var(--ink); }
  }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.2rem; border-bottom:2.5px solid var(--ink); }
  .modal-header h2 { font-size:1.4rem; }
  .modal-header button { background:none; border:none; font-size:1.5rem; cursor:pointer; line-height:1; width:32px; height:32px; }
  .cart-items { overflow-y:auto; padding:0.4rem 1.2rem; flex:1; }
  .cart-item { display:flex; align-items:center; justify-content:space-between; padding:0.9rem 0; border-bottom:1.5px solid var(--line); gap:0.7rem; }
  .cart-item-name { font-weight:800; font-size:0.94rem; }
  .cart-item-price { color:var(--ink-soft); font-size:0.82rem; font-weight:600; }
  .cart-footer { padding:1.1rem 1.2rem calc(1.1rem + var(--safe-bottom)); border-top:2.5px solid var(--ink); background:var(--paper); }
  .cart-total-row { display:flex; justify-content:space-between; align-items:baseline; font-weight:800; margin-bottom:0.9rem; }
  .cart-total-row .label { font-size:0.95rem; color:var(--ink-soft); font-weight:700; }
  .cart-total-row .value { font-size:1.35rem; }
  .btn { display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.95rem 1.2rem; font-weight:800; font-size:1rem; border-radius:14px; border:2.5px solid var(--ink); cursor:pointer; }
  .btn-primary { background:var(--brand-primary); color:white; box-shadow:var(--hard-sm); }
  .btn-primary:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .btn-primary[disabled] { opacity:0.45; pointer-events:none; }
  .btn-block { width:100%; }
  .btn-ghost { background:white; }
  .btn-ghost:active { transform:translate(1px,1px); }
  .empty-cart-note { text-align:center; color:var(--ink-soft); padding:2.8rem 1rem; font-weight:600; }

  /* ===== تأكيد الطلب / تتبع الحالة — أشبه بشاشة استلام الطلب بالكشك ===== */
  .confirmation { padding:1.8rem 1.4rem calc(1.8rem + var(--safe-bottom)); text-align:center; align-items:center; }
  .confirmation .big-icon {
    width:64px; height:64px; border-radius:50%; background:var(--green); border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:1.9rem; color:white; box-shadow:var(--hard-sm);
    margin-bottom:0.3rem;
  }
  .confirmation .order-meta { color:var(--ink-soft); font-size:0.88rem; font-weight:700; margin-top:0.2rem; }
  .confirmation .status-badge {
    display:inline-flex; align-items:center; gap:0.4rem; padding:0.55rem 1.1rem; border-radius:100px;
    border:2px solid var(--ink); font-weight:800; font-size:0.87rem; margin:1rem 0 1.4rem;
  }
  .status-dot { width:8px; height:8px; border-radius:50%; background:currentColor; animation: dotPulse 1.4s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
  .status-pending { background:#fff3d6; }
  .status-confirmed { background:#d6ecff; }
  .status-done { background:#d6f5e0; }
  .status-done .status-dot { animation:none; }

  /* تتبع الحالة على ثلاث خطوات — تسلسل فعلي (استلام ← تحضير ← جاهز)، فلهيك مبرر استخدام مؤشرات مرقّمة هون */
  .tracker { display:flex; align-items:flex-start; width:100%; max-width:300px; margin-bottom:1.6rem; }
  .tracker-step { display:flex; flex-direction:column; align-items:center; gap:0.45rem; flex:1; min-width:0; }
  .tracker-dot {
    width:30px; height:30px; border-radius:50%; border:2.5px solid var(--line); background:white;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.85rem; color:var(--gray);
    transition:background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .tracker-label { font-size:0.72rem; font-weight:700; color:var(--gray); white-space:nowrap; }
  .tracker-line { flex:0 0 auto; width:100%; max-width:56px; height:3px; background:var(--line); margin-top:14px; border-radius:2px; }
  .tracker-step.done .tracker-dot { background:var(--green); border-color:var(--green); color:white; }
  .tracker-step.done .tracker-label { color:var(--ink); }
  .tracker-step.active .tracker-dot { background:var(--brand-primary); border-color:var(--brand-primary); color:white; }
  .tracker-step.active .tracker-dot { animation: dotPulse 1.4s ease-in-out infinite; }
  .tracker-step.active .tracker-label { color:var(--ink); }

  [dir="ltr"] body { direction:ltr; }
</style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p data-i18n="loading">جاري تحميل المنيو…</p>
  </div>

  <div id="errorScreen" class="hidden">
    <div class="error-icon">!</div>
    <h2 id="errorTitle"></h2>
    <p id="errorMessage"></p>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <img id="logoImg" class="logo hidden" alt="logo">
        <div id="logoFallback" class="logo-fallback"></div>
        <div class="brand-text">
          <span class="name" id="restaurantName"></span>
          <span id="tableBadge" class="table-badge hidden"></span>
        </div>
      </div>
      <div class="header-actions">
        <span id="demoBadge" class="demo-badge hidden" data-i18n="previewMode"></span>
        <button class="icon-btn" id="langToggle">EN</button>
      </div>
    </header>

    <nav class="category-tabs" id="categoryTabs"></nav>
    <div class="search-bar hidden" id="searchBar">
      <input type="search" id="searchInput" data-i18n-placeholder="searchPlaceholder">
    </div>

    <main class="products-container" id="productsContainer"></main>

    <div class="cart-bar hidden" id="cartBar">
      <button id="openCartBtn">
        <span class="cart-left">
          <span class="cart-count" id="cartCount"></span>
          <span data-i18n="viewCart"></span>
        </span>
        <span class="cart-left">
          <span id="cartSummary"></span>
          <span class="cart-arrow" aria-hidden="true">‹</span>
        </span>
      </button>
    </div>
  </div>

  <div class="modal hidden" id="cartModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 data-i18n="yourOrder">طلبك</h2>
        <button id="closeCartBtn" aria-label="close">×</button>
      </div>
      <div class="cart-items" id="cartItemsList"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="label" data-i18n="total">الإجمالي</span>
          <span class="value" id="modalTotal"></span>
        </div>
        <button class="btn btn-primary btn-block" id="placeOrderBtn" data-i18n="placeOrder">إرسال الطلب</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="confirmationModal">
    <div class="modal-sheet confirmation">
      <div class="big-icon" aria-hidden="true">✓</div>
      <h2 data-i18n="orderPlaced">تم إرسال طلبك</h2>
      <div class="order-meta" id="confirmationMeta"></div>
      <div class="status-badge status-pending" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText"></span>
      </div>
      <div class="tracker" id="statusTracker">
        <div class="tracker-step" data-track="pending">
          <span class="tracker-dot">1</span>
          <span class="tracker-label" data-i18n="trackReceived"></span>
        </div>
        <div class="tracker-line"></div>
        <div class="tracker-step" data-track="confirmed">
          <span class="tracker-dot">2</span>
          <span class="tracker-label" data-i18n="trackPreparing"></span>
        </div>
        <div class="tracker-line"></div>
        <div class="tracker-step" data-track="done">
          <span class="tracker-dot">3</span>
          <span class="tracker-label" data-i18n="trackReady"></span>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="backToMenuBtn" data-i18n="backToMenu">الرجوع للمنيو</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ============================================================
  // 1) إعدادات الاتصال — Supabase مباشرة (بلا أي Node backend)، بلا أي تغيير
  //    عن العقد الأصلي. القيم الفعلية تُقرأ من ../assets/supabase-config.js،
  //    وMenuSDK (يُحمَّل ديناميكيًا بخطوة 3) هو من يتصل فعليًا.
  // ============================================================

  // ============================================================
  // 2) i18n — نفس المفاتيح الأصلية + إضافات لعناصر الكشك الجديدة فقط
  //    (شارة الطاولة + مسار تتبع الحالة على 3 خطوات)
  // ============================================================
  const I18N = {
    ar: {
      loading: "جاري تحميل المنيو…",
      previewMode: "معاينة تجريبية",
      viewCart: "السلة",
      yourOrder: "طلبك",
      total: "الإجمالي",
      placeOrder: "إرسال الطلب",
      sending: "جاري الإرسال…",
      orderPlaced: "تم إرسال طلبك",
      backToMenu: "الرجوع للمنيو",

      yourOrder: "Your order",
      total: "Total",
      placeOrder: "Place order",
      sending: "Sending…",
      orderPlaced: "Order placed",
      backToMenu: "Back to menu",
      searchPlaceholder: "Search menu…",
      emptyCart: "Your cart is empty — add something from the menu",
      emptyMenu: "No items available right now",
      noResults: "No items match your search",
      statusPending: "Your order is pending",
      statusConfirmed: "Order confirmed — being prepared",
      statusDone: "Your order is ready!",
      trackReceived: "Received",
      trackPreparing: "Preparing",
      trackReady: "Ready",
      yourTable: "Table",
      previewNotice: "Preview mode — this order is simulated and isn't sent to any real restaurant",
      err_RESTAURANT_NOT_FOUND_title: "Restaurant not found",
      err_RESTAURANT_NOT_FOUND_body: "This link looks incorrect, or the restaurant no longer exists.",
      err_RESTAURANT_INACTIVE_title: "Restaurant unavailable",
      err_RESTAURANT_INACTIVE_body: "This restaurant is temporarily unavailable. Please ask staff for help.",

      err_TABLE_NOT_FOUND_body: "The table/card code you scanned isn't valid.",
      err_TABLE_INACTIVE_title: "Table inactive",
      err_TABLE_INACTIVE_body: "This table isn't active right now — please notify staff.",
      err_INVALID_MENU_URL_title: "Invalid link",
      err_INVALID_MENU_URL_body: "Please scan the table's NFC/QR code again.",
      err_PRODUCT_UNAVAILABLE_title: "Item unavailable",
      err_PRODUCT_UNAVAILABLE_body: "One of the items in your order is no longer available — refresh and try again.",

      err_ACTIVE_ORDER_EXISTS_body: "There's already an unfinished order for this table. Ask staff if you need changes.",
      err_UNKNOWN_title: "Something went wrong",
      err_UNKNOWN_body: "Couldn't load the menu. Check your connection and try again.",
    },
  };

  let lang = (navigator.language || "ar").toLowerCase().startsWith("ar") ? "ar" : "en";

  function t(key) {
    return (I18N[lang] && I18N[lang][key]) || (I18N.ar[key] || key);
  }

  function applyLanguage() {
    const html = document.getElementById("htmlRoot");
    html.lang = lang;
    html.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
    });
    document.getElementById("langToggle").textContent = lang === "ar" ? "EN" : "AR";
  }

  // ============================================================
  // 3) تحميل MenuSDK — أصل ثابت (static asset)، بلا أي تغيير عن الأصلي
  // ============================================================
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("تعذر تحميل menu-sdk.js من " + src));
      document.head.appendChild(s);
    });
  }

  // ============================================================
  // 4) الحالة العامة للصفحة
  // ============================================================
  const cart = new Map(); // product_id -> { product, qty }
  let bootstrapData = null;
  let currentOrder = null; // { id, access_token }
  let stopPolling = null;
  const isDemo = new URLSearchParams(location.search).get("demo") === "1";

  function showScreen(name) {
    document.getElementById("loadingScreen").classList.toggle("hidden", name !== "loading");
    document.getElementById("errorScreen").classList.toggle("hidden", name !== "error");
    document.getElementById("app").classList.toggle("hidden", name !== "app");
  }

  function showError(code) {
    showScreen("error");
    document.getElementById("errorTitle").textContent = t(`err_${code}_title`) || t("err_UNKNOWN_title");
    document.getElementById("errorMessage").textContent = t(`err_${code}_body`) || t("err_UNKNOWN_body");
  }

  // ============================================================
  // 5) رندر المنيو
  // ============================================================
  function renderBranding(restaurant, table) {
    const colors = restaurant.brand_colors || {};
    const root = document.documentElement;
    if (colors.primary) root.style.setProperty("--brand-primary", colors.primary);
    if (colors.secondary) root.style.setProperty("--brand-secondary", colors.secondary);
    if (colors.accent) root.style.setProperty("--brand-accent", colors.accent);

    document.title = restaurant.name;
    document.getElementById("restaurantName").textContent = restaurant.name;
    document.getElementById("demoBadge").classList.toggle("hidden", !isDemo);

    const logoImg = document.getElementById("logoImg");
    const fallback = document.getElementById("logoFallback");
    if (restaurant.logo_url) {
      logoImg.src = restaurant.logo_url;
      logoImg.classList.remove("hidden");
      fallback.classList.add("hidden");
    } else {
      fallback.textContent = (restaurant.name || "؟").trim().charAt(0);
      fallback.classList.remove("hidden");
      logoImg.classList.add("hidden");
    }

    const tableBadge = document.getElementById("tableBadge");
    if (table && table.table_number != null) {
      tableBadge.textContent = `${t("yourTable")} ${table.table_number}`;
      tableBadge.classList.remove("hidden");
    } else {
      tableBadge.classList.add("hidden");
    }
  }

  let activeCategory = "__all__";
  let searchTerm = "";

  function renderCategoryTabs(categories) {
    const nav = document.getElementById("categoryTabs");
    const showCategories = bootstrapData?.template?.settings?.show_categories !== false;
    nav.classList.toggle("hidden", !showCategories);
    if (!showCategories) return;

    nav.innerHTML = "";
    const allTab = document.createElement("button");
    allTab.className = "cat-tab" + (activeCategory === "__all__" ? " active" : "");
    allTab.textContent = lang === "ar" ? "الكل" : "All";
    allTab.onclick = () => { activeCategory = "__all__"; renderProducts(); renderCategoryTabs(categories); };
    nav.appendChild(allTab);

    categories.forEach((cat) => {
      const btn = document.createElement("button");
      btn.className = "cat-tab" + (activeCategory === cat.name ? " active" : "");
      btn.textContent = cat.name;
      btn.onclick = () => { activeCategory = cat.name; renderProducts(); renderCategoryTabs(categories); };
      nav.appendChild(btn);
    });
  }

  function addControlHtml(p, qty) {
    return qty === 0
      ? `<button class="btn-add-fab" data-add aria-label="${lang === "ar" ? "أضف" : "Add"}">+</button>`
      : `<div class="qty-stepper" data-stepper>
           <button data-decr aria-label="−">−</button><span data-qty-value>${qty}</span><button data-incr aria-label="+">+</button>
         </div>`;
  }

  function productCardHtml(p, settings, isGrid) {
    const showImages = settings.show_images !== false;
    const cardStyle = settings.card_style === "compact" ? " compact" : "";
    const noImageClass = showImages ? "" : " no-image";
    const qty = cart.has(p.id) ? cart.get(p.id).qty : 0;
    const control = addControlHtml(p, qty);
    const overlayControl = isGrid && showImages ? `<div class="product-action-float">${control}</div>` : "";
    const inlineControl = !isGrid || !showImages ? `<div class="product-action-inline">${control}</div>` : "";

    return `
      <article class="product-card${cardStyle}${noImageClass}" data-product-id="${p.id}">
        ${showImages ? `
        <div class="product-media">
          ${p.image_url ? `<img loading="lazy" src="${p.image_url}" alt="${escapeHtml(p.name)}">` : `<span class="no-img" aria-hidden="true">🍽️</span>`}
          ${overlayControl}
        </div>` : ""}
        <div class="product-info">
          <h4 class="product-name">${escapeHtml(p.name)}</h4>
          <span class="product-price">${formatPrice(p.price)}</span>
          ${inlineControl}
        </div>
      </article>`;
  }

  function renderProducts() {
    if (!bootstrapData) return;
    const settings = bootstrapData.template?.settings || {};
    const isGrid = settings.layout !== "list";
    const layout = isGrid ? "layout-grid" : "layout-list";
    const container = document.getElementById("productsContainer");

    let categories = bootstrapData.menu.categories;
    if (activeCategory !== "__all__") {
      categories = categories.filter((c) => c.name === activeCategory);
    }

    const term = searchTerm.trim().toLowerCase();
    const sections = categories
      .map((cat) => ({
        name: cat.name,
        products: term ? cat.products.filter((p) => p.name.toLowerCase().includes(term)) : cat.products,
      }))
      .filter((cat) => cat.products.length > 0);

    if (sections.length === 0) {
      container.innerHTML = `<div class="empty-state">${term ? t("noResults") : t("emptyMenu")}</div>`;
      return;
    }

    container.innerHTML = sections
      .map(
        (cat) => `
        <section class="category-section">
          <h3 class="category-title">${escapeHtml(cat.name)}</h3>
          <div class="products-grid ${layout}">
            ${cat.products.map((p) => productCardHtml(p, settings, isGrid)).join("")}
          </div>
        </section>`
      )
      .join("");

    container.querySelectorAll("[data-product-id]").forEach((card) => {
      const id = Number(card.getAttribute("data-product-id"));
      const product = findProductById(id);
      const addBtn = card.querySelector("[data-add]");
      if (addBtn) addBtn.onclick = () => { addToCart(product); renderProducts(); updateCartBar(true); };
      const incr = card.querySelector("[data-incr]");
      const decr = card.querySelector("[data-decr]");
      if (incr) incr.onclick = () => { addToCart(product); renderProducts(); updateCartBar(true); };
      if (decr) decr.onclick = () => { removeOneFromCart(id); renderProducts(); updateCartBar(); };
    });
  }

  function findProductById(id) {
    for (const cat of bootstrapData.menu.categories) {
      const found = cat.products.find((p) => p.id === id);
      if (found) return found;
    }
    return null;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatPrice(n) {
    const num = Number(n);
    return (Number.isFinite(num) ? num.toFixed(2) : n) + (lang === "ar" ? " ₪" : " ₪");
  }

  // ============================================================
  // 6) السلة
  // ============================================================
  function addToCart(product) {
    if (!product) return;
    const entry = cart.get(product.id) || { product, qty: 0 };
    entry.qty += 1;
    cart.set(product.id, entry);
  }
  function removeOneFromCart(id) {
    const entry = cart.get(id);
    if (!entry) return;
    entry.qty -= 1;
    if (entry.qty <= 0) cart.delete(id); else cart.set(id, entry);
  }
  function cartTotal() {
    let total = 0;
    cart.forEach((e) => { total += Number(e.product.price) * e.qty; });
    return total;
  }
  function cartCount() {
    let count = 0;
    cart.forEach((e) => { count += e.qty; });
    return count;
  }
  function updateCartBar(justChanged) {
    const bar = document.getElementById("cartBar");
    const count = cartCount();
    bar.classList.toggle("hidden", count === 0);
    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartSummary").textContent = formatPrice(cartTotal());
    if (justChanged && count > 0) {
      bar.classList.remove("pop");
      // إعادة تشغيل الحركة (بند "motion يرد على فعل المستخدم" — إضافة سلعة فقط، لا شيء متكرر تلقائيًا)
      void bar.offsetWidth;
      bar.classList.add("pop");
    }
  }
  function renderCartModal() {
    const list = document.getElementById("cartItemsList");
    if (cart.size === 0) {
      list.innerHTML = `<div class="empty-cart-note">${t("emptyCart")}</div>`;
    } else {
      list.innerHTML = [...cart.values()]
        .map(
          (e) => `
        <div class="cart-item" data-cart-id="${e.product.id}">
          <div>
            <div class="cart-item-name">${escapeHtml(e.product.name)}</div>
            <div class="cart-item-price">${formatPrice(e.product.price)} × ${e.qty}</div>
          </div>
          <div class="qty-stepper">
            <button data-decr aria-label="−">−</button><span>${e.qty}</span><button data-incr aria-label="+">+</button>
          </div>
        </div>`
        )
        .join("");
      list.querySelectorAll("[data-cart-id]").forEach((row) => {
        const id = Number(row.getAttribute("data-cart-id"));
        row.querySelector("[data-incr]").onclick = () => { addToCart(cart.get(id).product); renderCartModal(); updateCartBar(); renderProducts(); };
        row.querySelector("[data-decr]").onclick = () => { removeOneFromCart(id); renderCartModal(); updateCartBar(); renderProducts(); };
      });
    }
    document.getElementById("modalTotal").textContent = formatPrice(cartTotal());
    document.getElementById("placeOrderBtn").disabled = cart.size === 0;
  }

  // ============================================================
  // 7) الطلب + التأكيد + polling الحالة
  // ============================================================
  async function placeOrder() {
    const btn = document.getElementById("placeOrderBtn");
    btn.disabled = true;
    btn.textContent = t("sending");
    try {
      const items = [...cart.values()].map((e) => ({ product_id: e.product.id, qty: e.qty }));
      const order = await MenuSDK.createOrder(items);
      currentOrder = { id: order.id, access_token: order.access_token };
      cart.clear();
      updateCartBar();
      document.getElementById("cartModal").classList.add("hidden");
      openConfirmation();
    } catch (err) {
      alert((err && err.message) || t("err_UNKNOWN_body"));
    } finally {
      btn.disabled = false;
      btn.textContent = t("placeOrder");
    }
  }

  function statusLabel(status) {
    if (status === "confirmed") return t("statusConfirmed");
    if (status === "done") return t("statusDone");
    return t("statusPending");
  }

  const STATUS_SEQUENCE = ["pending", "confirmed", "done"];
  function updateTracker(status) {
    const currentIndex = STATUS_SEQUENCE.indexOf(status);
    document.querySelectorAll("#statusTracker .tracker-step").forEach((step) => {
      const stepIndex = STATUS_SEQUENCE.indexOf(step.getAttribute("data-track"));
      step.classList.toggle("done", stepIndex < currentIndex || status === "done");
      step.classList.toggle("active", stepIndex === currentIndex && status !== "done");
      if (status === "done") step.classList.remove("active");
    });
  }

  function openConfirmation() {
    const modal = document.getElementById("confirmationModal");
    modal.classList.remove("hidden");
    const table = bootstrapData?.table;
    const tablePart = table && table.table_number != null ? `${t("yourTable")} ${table.table_number} · ` : "";
    document.getElementById("confirmationMeta").textContent = isDemo ? t("previewNotice") : tablePart + "#" + currentOrder.id;

    const badge = document.getElementById("statusBadge");
    const text = document.getElementById("statusText");
    badge.className = "status-badge status-pending";
    text.textContent = statusLabel("pending");
    updateTracker("pending");

    if (stopPolling) stopPolling();
    stopPolling = MenuSDK.pollOrderStatus(currentOrder.id, currentOrder.access_token, (order, err) => {
      if (err) return;
      badge.className = "status-badge status-" + order.status;
      text.textContent = statusLabel(order.status);
      updateTracker(order.status);
    });
  }

  // ============================================================
  // 8) الإقلاع
  // ============================================================
  async function boot() {
    applyLanguage();
    try {
      await loadScript("../assets/menu-sdk.js");
    } catch (err) {
      showError("UNKNOWN");
      return;
    }

    MenuSDK.init({ demo: isDemo });

    if (!isDemo && !MenuSDK._state.slug) {
      showError("INVALID_MENU_URL");
      return;
    }

    try {
      bootstrapData = await MenuSDK.getBootstrap();
    } catch (err) {
      showError(err && err.code ? err.code : "UNKNOWN");
      return;
    }

    // قالب مخصص (مو المدمج): حوّل المتصفح لملفاته الفعلية المستضافة على Supabase Storage —
    // عزل origin حقيقي، بلا أي تغيير عن الآلية الأصلية.
    if (!isDemo && bootstrapData.template && !bootstrapData.template.is_builtin && bootstrapData.template.entry_url) {
      const target = new URL(bootstrapData.template.entry_url);
      target.searchParams.set("r", MenuSDK._state.slug);
      target.searchParams.set("t", MenuSDK._state.token);
      location.replace(target.toString());
      return;
    }

    renderBranding(bootstrapData.restaurant, bootstrapData.table);
    renderCategoryTabs(bootstrapData.menu.categories);

    const showSearch = bootstrapData.template?.settings?.show_search;
    if (showSearch) {
      document.getElementById("searchBar").classList.remove("hidden");
      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value;
        renderProducts();
      });
    }

    renderProducts();
    updateCartBar();
    showScreen("app");
  }

  // ============================================================
  // 9) ربط الأحداث الثابتة
  // ============================================================
  document.getElementById("langToggle").onclick = () => {
    lang = lang === "ar" ? "en" : "ar";
    applyLanguage();
    if (bootstrapData) {
      renderBranding(bootstrapData.restaurant, bootstrapData.table);
      renderCategoryTabs(bootstrapData.menu.categories);
      renderProducts();
      updateCartBar();
    }
  };
  document.getElementById("openCartBtn").onclick = () => {
    renderCartModal();
    document.getElementById("cartModal").classList.remove("hidden");
  };
  document.getElementById("closeCartBtn").onclick = () => document.getElementById("cartModal").classList.add("hidden");
  document.getElementById("placeOrderBtn").onclick = placeOrder;
  document.getElementById("backToMenuBtn").onclick = () => {
    document.getElementById("confirmationModal").classList.add("hidden");
    if (stopPolling) stopPolling();
  };

  boot();
})();
</script>
